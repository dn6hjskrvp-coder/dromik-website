<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimposta password · Dromik</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --blue: #0B1F5E;
      --gold: #E8A23A;
      --white: #FFFFFF;
      --text: #111827;
      --muted: #667085;
      --border: #DCE2EA;
      --field: #F4F6F9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background: var(--blue);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: min(100%, 460px);
    }

    .logo {
      display: block;
      width: 230px;
      height: auto;
      margin: 0 auto 28px;
    }

    .card {
      padding: 34px 34px 30px;
      border-radius: 20px;
      background: var(--white);
      box-shadow: 0 24px 70px rgba(5, 24, 70, 0.24);
    }

    h1 {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 1.7rem;
      line-height: 1.2;
      letter-spacing: -0.035em;
      text-align: center;
    }

    .intro {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--blue);
      font-size: 0.9rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--field);
      color: var(--text);
      font: inherit;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(11, 31, 94, 0.12);
    }

    button,
    .return-link {
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
    }

    button {
      margin-top: 4px;
      background: var(--gold);
      color: var(--blue);
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .message {
      margin: 20px 0 0;
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .message.error {
      background: #FEF2F2;
      color: #991B1B;
    }

    .message.success {
      background: #ECFDF3;
      color: #166534;
      text-align: center;
    }

    .loading {
      margin: 12px 0 0;
      color: var(--muted);
      text-align: center;
    }

    .return-link {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      border: 1px solid rgba(11, 31, 94, 0.18);
      color: var(--blue);
      background: var(--white);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 520px) {
      .logo {
        width: 195px;
      }

      .card {
        padding: 28px 22px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="assets/dromik-logo-white.svg" alt="Dromik" class="logo">

    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Reimposta password</h1>
      <p class="intro">Scegli una nuova password per il tuo account Dromik.</p>

      <p id="loading" class="loading">Verifica del link in corso…</p>

      <form id="reset-form" hidden novalidate>
        <label>
          Nuova password
          <input
            id="new-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </label>

        <label>
          Conferma nuova password
          <input
            id="confirm-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </label>

        <button id="submit-button" type="submit">Aggiorna password</button>
      </form>

      <p id="message" class="message" role="alert" hidden></p>

      <div id="success" hidden>
        <p class="message success">Password aggiornata correttamente.</p>
        <a class="return-link" href="http://localhost:8502">Torna a Dromik</a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const recovery = {
        accessToken: fragment.get("access_token"),
        refreshToken: fragment.get("refresh_token"),
        type: fragment.get("type")
      };

      if (window.location.hash) {
        history.replaceState(null, document.title, window.location.pathname + window.location.search);
      }

      Object.defineProperty(window, "__dromikRecovery", {
        value: recovery,
        configurable: true
      });
    })();
  </script>

  <script type="module">
    const SUPABASE_URL = "https://xzbnkhcrcaxzcyijhhek.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MHGKa2nMc5NuQts4DCTKcw_XCbDpi6K";
    const INVALID_LINK_MESSAGE =
      "Il link di recupero non è valido o è scaduto. Richiedi un nuovo link da Dromik.";

    const recovery = window.__dromikRecovery;
    delete window.__dromikRecovery;

    let accessToken = recovery?.accessToken ?? "";
    let refreshToken = recovery?.refreshToken ?? "";

    const loading = document.querySelector("#loading");
    const form = document.querySelector("#reset-form");
    const message = document.querySelector("#message");
    const success = document.querySelector("#success");
    const submitButton = document.querySelector("#submit-button");
    const newPassword = document.querySelector("#new-password");
    const confirmPassword = document.querySelector("#confirm-password");

    const showError = (text) => {
      loading.hidden = true;
      form.hidden = true;
      success.hidden = true;
      message.textContent = text;
      message.className = "message error";
      message.hidden = false;
    };

    const showValidationError = (text) => {
      message.textContent = text;
      message.className = "message error";
      message.hidden = false;
    };

    const start = async () => {
      if (recovery?.type !== "recovery" || !accessToken || !refreshToken) {
        accessToken = "";
        refreshToken = "";
        showError(INVALID_LINK_MESSAGE);
        return;
      }

      try {
        const { createClient } = await import(
          "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        );
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            autoRefreshToken: false,
            persistSession: false,
            detectSessionInUrl: false
          }
        });

        const { data, error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        accessToken = "";
        refreshToken = "";

        if (error || !data.session || !data.user) {
          showError(INVALID_LINK_MESSAGE);
          return;
        }

        loading.hidden = true;
        form.hidden = false;

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          message.hidden = true;

          if (newPassword.value.length < 8) {
            showValidationError("La password deve contenere almeno 8 caratteri.");
            return;
          }

          if (newPassword.value !== confirmPassword.value) {
            showValidationError("Le due password non coincidono.");
            return;
          }

          submitButton.disabled = true;

          const { error: updateError } = await supabase.auth.updateUser({
            password: newPassword.value
          });

          if (updateError) {
            newPassword.value = "";
            confirmPassword.value = "";
            submitButton.disabled = false;
            showError(INVALID_LINK_MESSAGE);
            return;
          }

          newPassword.value = "";
          confirmPassword.value = "";

          try {
            await supabase.auth.signOut();
          } catch (_) {
            // La sessione non viene persistita nel browser.
          }

          form.hidden = true;
          message.hidden = true;
          success.hidden = false;
        });
      } catch (_) {
        accessToken = "";
        refreshToken = "";
        showError(INVALID_LINK_MESSAGE);
      }
    };

    start();
  </script>
</body>
</html>
